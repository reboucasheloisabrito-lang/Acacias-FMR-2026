<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>M!SS - Rede de Proteção</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" type="text/css" media="screen" href="style2.css">
  <script src="model.js" defer></script>
  <script src="view.js" defer></script>
  <script src="controller.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="logo" href="#" aria-label="M!SS início"><span class="logo-flower">✿</span>M!SS</a>
    </header>

    <main>
      <section class="intro">
        <h1>Bem-vinda ao M!SS</h1>
        <p class="subheading">Crie sua conta para montar sua rede de proteção.</p>
      </section>

      <form class="form-card" id="cadastro">
        <label for="nome">Nome completo</label>
        <input id="nome" name="nome" type="text" placeholder="Nome" autocomplete="name" required>

        <label for="nascimento">Data de nascimento</label>
        <input id="nascimento" name="nascimento" type="date" autocomplete="bday" required>

        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" placeholder="Ex: nome@gmail.com" autocomplete="email" required>

        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" placeholder="Senha" autocomplete="new-password" required>

        <label for="cep">CEP</label>
        <input id="cep" name="cep" type="text" inputmode="numeric" maxlength="9" placeholder="00000-000" autocomplete="postal-code" required>

        <label for="bairro">Bairro</label>
        <input id="bairro" name="bairro" type="text" placeholder="Bairro" required>

        <div class="form-row">
          <div>
            <label for="rua">Rua</label>
            <input id="rua" name="rua" type="text" placeholder="Rua" required>
          </div>
          <div>
            <label for="numero">Número</label>
            <input id="numero" name="numero" type="text" inputmode="numeric" placeholder="Nº" required>
          </div>
        </div>

        <button class="primary-button full-width" type="submit">Cadastrar</button>
      </form>

      <p class="disclaimer">Seus dados são usados apenas para sua segurança.</p>
    </main>
  </div>
</body>
</html>
